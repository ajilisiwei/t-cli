name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # Throwaway database for the server's integration tests (production runs
      # PostgreSQL 16 too). Trust auth: the service is reachable only from
      # this job, so no credential is needed or stored.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # The server runs TypeScript directly via Node's type stripping (>= 24).
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck server
        run: npm run typecheck -w @t-cli/server

      - name: Typecheck mini-program
        run: npm run typecheck -w @t-cli/miniprogram

      # The PDF export tests render with the real Typst and fonts. Versions and
      # SHA-256 sums are pinned in fetch-typst.sh (shared with the Dockerfile),
      # so the cache key is that script's hash.
      - name: Cache Typst and fonts
        id: typst-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/typst
          key: typst-${{ runner.os }}-${{ hashFiles('apps/server/deploy/fetch-typst.sh') }}

      - name: Install Typst and fonts
        if: steps.typst-cache.outputs.cache-hit != 'true'
        run: sh apps/server/deploy/fetch-typst.sh "$RUNNER_TEMP/typst"

      - name: Run tests
        # Unit tests never call the live API, so no API secret is injected here —
        # keeps secrets out of PR/fork build surfaces.
        env:
          TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
          TYPST_BIN: ${{ runner.temp }}/typst/bin/typst
          TYPST_FONT_PATH: ${{ runner.temp }}/typst/fonts
          # Fail instead of skipping the render tests if Typst is missing.
          TYPST_REQUIRED: "1"
        run: npm test
