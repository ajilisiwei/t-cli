name: Mini-program upload

# Manual only. Uploads apps/miniprogram as a development version with
# miniprogram-ci; select it as 体验版 in the mini-program admin console
# (版本管理). Mirrors heji-ledger's scripts/upload.mjs flow.
#
# Configure once (Settings → Secrets and variables → Actions):
#   secret    WX_UPLOAD_PRIVATE_KEY  the 小程序代码上传 key (full PEM text). Never commit it.
#   variable  WX_APPID               the mini-program AppID (not a secret).
# In the admin console (开发 → 开发管理 → 开发设置 → 小程序代码上传) turn the
# key's IP whitelist off: GitHub-hosted runners have no fixed address.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version shown in the console (x.y.z)
        required: true
      desc:
        description: Description (empty → commit and time)
        required: false
        default: ''
      robot:
        description: miniprogram-ci robot number (1–30)
        required: false
        default: '1'

permissions:
  contents: read

concurrency:
  group: mp-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      # Installed for this job only; not a dependency of the repository.
      MINIPROGRAM_CI_VERSION: 2.1.31
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck mini-program
        run: npm run typecheck -w @t-cli/miniprogram

      - name: Unit tests (mini-program)
        run: npm test -w @t-cli/miniprogram

      - name: Install miniprogram-ci
        run: npm install --prefix "$RUNNER_TEMP/mpci" --no-audit --no-fund "miniprogram-ci@${MINIPROGRAM_CI_VERSION}"

      - name: Write upload key
        env:
          WX_UPLOAD_PRIVATE_KEY: ${{ secrets.WX_UPLOAD_PRIVATE_KEY }}
        run: |
          if [ -z "$WX_UPLOAD_PRIVATE_KEY" ]; then
            echo "::error::Repository secret WX_UPLOAD_PRIVATE_KEY is not set."
            exit 1
          fi
          umask 077
          printf '%s\n' "$WX_UPLOAD_PRIVATE_KEY" > "$RUNNER_TEMP/upload.key"

      - name: Upload
        env:
          WX_APPID: ${{ vars.WX_APPID }}
          WX_UPLOAD_KEY: ${{ runner.temp }}/upload.key
          MINIPROGRAM_CI_DIR: ${{ runner.temp }}/mpci
          # Inputs reach the script through the environment, never interpolated into shell.
          VERSION: ${{ inputs.version }}
          DESC: ${{ inputs.desc }}
          ROBOT: ${{ inputs.robot }}
        run: |
          args=(--version "$VERSION" --robot "$ROBOT")
          if [ -n "$DESC" ]; then args+=(--desc "$DESC"); fi
          node apps/miniprogram/scripts/upload.mjs "${args[@]}"

      - name: Remove upload key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.key"
