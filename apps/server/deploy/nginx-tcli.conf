# t-cli API server block — to be added to heji-ledger's deploy/nginx/nginx.conf
# (that file is deployed by heji's CI; editing it only on the server would be
# overwritten by the next heji deploy). Requires:
#   - DNS: <TCLI_DOMAIN> A record -> the ECS public IP
#   - a certificate covering <TCLI_DOMAIN> (extend heji's issue-cert.sh SAN list
#     or issue a separate cert; heji uses DNS-01)
# Replace <TCLI_DOMAIN> (e.g. tcli.guangqingai.top — to be decided).

server {
    listen      443 ssl;
    http2       on;
    server_name <TCLI_DOMAIN>;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;   # must include <TCLI_DOMAIN>
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # Re-resolve the container name every 10 s. A literal hostname in
    # proxy_pass is resolved once at startup and cached forever — heji lost
    # two days to exactly that after a container was recreated (see heji's
    # nginx.conf). Hence the variable below.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Push batches of the CLI outbox can be a few MB.
    client_max_body_size 8m;

    # Streaming AI proxy: NDJSON must reach the mini-program chunk by chunk.
    location /v1/ai/ {
        set                $tcli_upstream tcli-api;
        proxy_pass         http://$tcli_upstream:3000;
        proxy_http_version 1.1;
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 120s;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        set                $tcli_upstream tcli-api;
        proxy_pass         http://$tcli_upstream:3000;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
