# t-cli sync server — production (Aliyun ECS shared with 花了知多少 / heji).
#
# Lives at /home/deploy/tcli/docker-compose.prod.yml. It does NOT run its own
# database or reverse proxy: it joins heji's compose network so that
#   - heji's PostgreSQL 16 is reachable as `postgres:5432` (database `tcli`,
#     its own role — see init-db.sh), and
#   - heji's nginx reaches this container as `tcli-api:3000` (see nginx-tcli.conf).
#
# Memory budget (verified on the box 2026-11-18, V1): 1607 MB RAM + 4 GB swap,
# 716 MB used and 891 MB available with all of heji up; heji's containers use
# ~181 MB together. The cap below is the instruction Node sizes its heap from;
# a Node API of this size measured ~87 MB under a 256 MB cap.
#
# heji's deploy prunes unused images older than 7 days (`docker image prune -a
# --filter until=168h`), so rolling back to an old TCLI_IMAGE may need a fresh
# pull from ghcr.

name: tcli

services:
  api:
    image: ${TCLI_IMAGE:?TCLI_IMAGE is required, e.g. ghcr.io/<owner>/t-cli-server:sha-abc1234}
    container_name: tcli-api
    restart: unless-stopped
    # DATABASE_URL, JWT_SECRET, DEEPSEEK_API_KEY, WECHAT_APPID, WECHAT_SECRET.
    # Created by hand on the server (see .env.prod.example); never in git or CI.
    env_file: .env.prod
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_POOL_MAX: '5'
    # NOT published: only heji's nginx (same network) talks to it.
    expose:
      - '3000'
    mem_limit: 256m
    networks:
      heji:
        aliases: [tcli-api]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  heji:
    external: true
    # heji's compose project is named `heji`, so its default network is
    # `heji_default` (verified with `docker network ls`, V1). While tcli-api is
    # attached, `docker compose down` on heji cannot remove this network.
    name: heji_default
