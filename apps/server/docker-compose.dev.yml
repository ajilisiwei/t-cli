# Local development / test database only. Bound to 127.0.0.1 with trust auth,
# so no credential exists to leak; never use this file for any deployment.
name: tcli-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: tcli-pg-dev
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: tcli
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '127.0.0.1:55433:5432'
    volumes:
      - tcli-pg-dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  tcli-pg-dev:
